<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1426"/><stop offset="1" stop-color="#13213D"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9DB8FF"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2BD67B"/></marker>
</defs>
<rect width="1280" height="640" fill="url(#bg)"/>
<text x="60" y="70" fill="#5B8CFF" font-size="18" font-weight="700" letter-spacing="5">MISSION CONTROL</text>
<text x="60" y="108" fill="#FFFFFF" font-size="34" font-weight="800">How work flows to GitHub</text>
<g font-size="20" font-weight="700" text-anchor="middle">
<rect x="60" y="230" width="220" height="170" rx="18" fill="#2BD67B" fill-opacity="0.1" stroke="#2BD67B" stroke-width="2"/>
<text x="170" y="290" fill="#2BD67B">Workers</text>
<text x="170" y="322" fill="#8A97B0" font-size="15" font-weight="400">any coding agent or person</text>
<text x="170" y="346" fill="#8A97B0" font-size="15" font-weight="400">no GitHub credentials</text>
<rect x="400" y="200" width="250" height="230" rx="18" fill="#5B8CFF" fill-opacity="0.18" stroke="#5B8CFF" stroke-width="2"/>
<text x="525" y="262" fill="#FFFFFF" font-size="22">Mission Control</text>
<text x="525" y="294" fill="#8A97B0" font-size="15" font-weight="400">your coordination server</text>
<text x="525" y="326" fill="#8A97B0" font-size="15" font-weight="400">jobs · runbook allowlist</text>
<text x="525" y="350" fill="#8A97B0" font-size="15" font-weight="400">audit log · CloudEvents</text>
<rect x="770" y="230" width="200" height="170" rx="18" fill="#FFB020" fill-opacity="0.1" stroke="#FFB020" stroke-width="2"/>
<text x="870" y="290" fill="#FFB020">GitHub App</text>
<text x="870" y="322" fill="#8A97B0" font-size="15" font-weight="400">installed on your org</text>
<text x="870" y="346" fill="#8A97B0" font-size="15" font-weight="400">key held by server</text>
<rect x="1060" y="150" width="180" height="140" rx="18" fill="#4A74E0" fill-opacity="0.1" stroke="#4A74E0" stroke-width="2"/>
<text x="1150" y="210" fill="#4A74E0">GitHub</text>
<text x="1150" y="240" fill="#8A97B0" font-size="15" font-weight="400">your org · issues · PRs</text>
<rect x="1060" y="350" width="180" height="140" rx="18" fill="#4A74E0" fill-opacity="0.1" stroke="#4A74E0" stroke-width="2"/>
<text x="1150" y="410" fill="#4A74E0">Project board</text>
<text x="1150" y="440" fill="#8A97B0" font-size="13" font-weight="400">Ready → Done</text>
</g>
<g fill="none" stroke-width="2.5">
<path d="M280 290H392" stroke="#9DB8FF" marker-end="url(#a)"/>
<path d="M650 290H762" stroke="#9DB8FF" marker-end="url(#a)"/>
<path d="M970 280C1010 280 1020 220 1052 220" stroke="#9DB8FF" marker-end="url(#a)"/>
<path d="M970 350C1010 350 1020 420 1052 420" stroke="#9DB8FF" marker-end="url(#a)"/>
<path d="M1150 490V560H525V438" stroke="#2BD67B" stroke-dasharray="8 7" marker-end="url(#g)"/>
<path d="M392 360H288" stroke="#2BD67B" stroke-dasharray="8 7" marker-end="url(#g)"/>
</g>
<g font-size="15" fill="#E8EEF8" text-anchor="middle">
<text x="336" y="276">request</text>
<text x="706" y="276">1-hour token</text>
<text x="1010" y="196">act</text>
<text x="1010" y="455">move cards</text>
<text x="838" y="586" fill="#2BD67B">webhooks: issues · PRs · checks · card moves</text>
<text x="340" y="386" fill="#2BD67B">events</text>
</g>
<text x="60" y="612" fill="#8A97B0" font-size="14">Workers request only allowlisted actions. No admin, secrets, branch protection, workflow edits, or repo deletion.</text>
</svg>
